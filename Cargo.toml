[package]
name = "fill-build-hasher"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }
tokio-retry = "0.3.2"
reqwest = "0.13.4"
md-5 = "0.11.0"
sha2 = "0.11.0"
serde = { version = "1.0.229", features = ["serde_derive"] }
serde_json = "1.0.151"
csv = "1.4.0"
indicatif = "0.18.6"
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
hex = "0.4.3"
